name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://batam_erp:batam_erp@localhost:5432/batam_erp
      DIRECT_URL: postgresql://batam_erp:batam_erp@localhost:5432/batam_erp
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: batam_erp
          POSTGRES_USER: batam_erp
          POSTGRES_PASSWORD: batam_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U batam_erp -d batam_erp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @batam/api prisma:validate
      - run: pnpm --filter @batam/api exec prisma migrate deploy
      - run: pnpm check
